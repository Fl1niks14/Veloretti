services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: city_bikes
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./Velorettiwb_server
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password123@db:5432/city_bikes

  frontend:
    build: ./Velorettiwb
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
